# Golden corpus — linear equations (Phase 1a)
# Each case: input → expected exact answer, step operations, or error code.
# See docs/testing.md §4 edge matrix. Append-only: add rows, never weaken rows.
- input: "2x + 5 = 17"
  exact: ["6"]
  ops: [subtract_both_sides, divide_both_sides]
- input: "x - 4 = 9"
  exact: ["13"]
  ops: [add_both_sides]
- input: "x/3 = 4"
  exact: ["12"]
  ops: [multiply_both_sides]
- input: "2(x + 3) = 14"
  exact: ["4"]
  ops: [distribute, subtract_both_sides, divide_both_sides]
- input: "3x + 2 = x + 8"
  exact: ["3"]
  ops: [collect_like_terms, divide_both_sides]
- input: "x = 0"
  exact: ["0"]
  ops: []
- input: "-x = 5"
  exact: ["-5"]
  ops: [divide_both_sides]
- input: "x/2 + 1/3 = 5/6"
  exact: ["1"]
  ops: [subtract_both_sides, multiply_both_sides]
- input: "0*x + 5 = 17"
  error: NO_SOLUTION
- input: "x + 2 = x + 2"
  error: INFINITE_SOLUTIONS
- input: "5 = 6"
  error: NO_SOLUTION
- input: "2x + = 17"
  error: PARSE_ERROR
- input: "x^2 = 4"
  error: UNSOLVABLE
- input: "sqrt(2)*x = 2"
  exact: ["sqrt(2)"]
  approx: 1.4142135623730951
  ops: [divide_both_sides]
