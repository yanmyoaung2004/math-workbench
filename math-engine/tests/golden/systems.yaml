# Golden corpus — 2x2 linear systems (Phase 1b). Append-only.
- input: ["2x + y = 7", "x - y = 2"]
  op: solve_system
  bindings: [["x", "3"], ["y", "1"]]
  ops: [eliminate_variable, divide_both_sides, substitute_back, divide_both_sides]
- input: ["x + y = 5", "x - y = 1"]
  op: solve_system
  bindings: [["x", "3"], ["y", "2"]]
  ops: [eliminate_variable, divide_both_sides, substitute_back, divide_both_sides]
- input: ["x + y = 1", "x + y = 2"]
  op: solve_system
  error: NO_SOLUTION
- input: ["2x + 2y = 4", "x + y = 2"]
  op: solve_system
  error: INFINITE_SOLUTIONS
