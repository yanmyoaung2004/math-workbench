[project]
name = "workbench-math"
version = "0.1.0"
description = "Deterministic GCSE math engine (hexagonal core) for Math Workbench"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
